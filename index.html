<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#12161B">
<title>Trap Book</title>
<style>
:root{
  --bg:#12161B; --panel:#1B2129; --line:#2A323D;
  --bone:#DCD5C6; --slate:#5A6874;
  --ink:#E9E4DA; --mut:#8C96A2;
  --amber:#E3A83F; --amber-soft:rgba(227,168,63,.35);
  --red:#C05648; --green:#7FA86B;
  --serif:Georgia,'Times New Roman',serif;
  --sans:-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;align-items:center;overflow:hidden}
#app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;overflow-y:auto;padding:10px 12px calc(90px + env(safe-area-inset-bottom))}

header{display:flex;justify-content:space-between;align-items:baseline;padding:2px 2px 8px}
header h1{font-family:var(--serif);font-size:19px;font-weight:400;letter-spacing:.4px}
header h1 em{font-style:normal;color:var(--amber)}
#undo{background:none;border:1px solid var(--line);color:var(--mut);font-size:12px;padding:4px 10px;border-radius:4px;font-family:var(--sans);margin-right:4px}
#reset{background:none;border:1px solid var(--line);color:var(--mut);font-size:12px;padding:4px 10px;border-radius:4px;font-family:var(--sans)}

/* hunt strip */
#hunt{display:flex;gap:6px;overflow-x:auto;padding:0 2px 8px;scrollbar-width:none;min-height:30px}
#hunt::-webkit-scrollbar{display:none}
.tag{flex:0 0 auto;font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:3px;padding:3px 7px;white-space:nowrap}
.tag.hot{color:var(--amber);border-color:var(--amber-soft)}

/* board */
#boardwrap{position:relative;width:100%;aspect-ratio:1/1}
#board{display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);width:100%;height:100%;border:1px solid var(--line)}
.sq{display:flex;align-items:center;justify-content:center;font-size:min(9.2vw,40px);line-height:1;position:relative;user-select:none}
.sq.l{background:var(--bone)}.sq.d{background:var(--slate)}
.sq .p{transform:translateY(-1px)}
.sq.w .p{color:#FAF7F0;text-shadow:0 1px 1px rgba(0,0,0,.55)}
.sq.b .p{color:#1A1E24;text-shadow:0 1px 1px rgba(255,255,255,.18)}
.sq.from::after,.sq.to::after{content:'';position:absolute;inset:0;background:var(--amber-soft)}
.sq.sel::after{content:'';position:absolute;inset:0;outline:3px solid var(--amber);outline-offset:-3px}
.sq.hintfrom::after{content:'';position:absolute;inset:0;outline:3px dashed var(--amber);outline-offset:-3px}
.sq.hintto::after{content:'';position:absolute;inset:0;background:var(--amber-soft)}
.coord{position:absolute;font-size:9px;color:rgba(0,0,0,.45);pointer-events:none}
.sq.d .coord{color:rgba(255,255,255,.4)}
.cf{right:2px;bottom:1px}.cr{left:2px;top:1px}

/* status + options */
#status{padding:12px 2px 6px;min-height:56px}
#stateline{font-size:13px;color:var(--mut);letter-spacing:.3px;text-transform:uppercase;font-size:11px}
#mainline{font-family:var(--serif);font-size:17px;margin-top:3px}
#mainline .mv{color:var(--amber)}
#opts{display:flex;flex-direction:column;gap:6px;padding-top:6px;overflow-y:auto}
.opt{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;text-align:left;color:var(--ink);font-family:var(--sans);width:100%}
.opt:active{border-color:var(--amber)}
.opt .san{font-family:var(--serif);font-size:18px;color:var(--amber);min-width:52px}
.opt .tr{font-size:12px;color:var(--mut);flex:1}
.opt .mate{font-size:10px;color:var(--bg);background:var(--amber);border-radius:3px;padding:2px 5px;letter-spacing:.5px}

/* plates */
.plate{margin-top:8px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:6px;padding:12px 14px}
.plate.deadend{border-left-color:var(--red)}
.plate.win{border-left-color:var(--green)}
.plate h2{font-family:var(--serif);font-weight:400;font-size:18px;margin-bottom:4px}
.plate p{font-size:13px;color:var(--mut);line-height:1.45}
.plate button{margin-top:10px;background:var(--amber);border:none;color:var(--bg);font-size:13px;padding:8px 14px;border-radius:5px;font-family:var(--sans)}

/* side picker */
#pick{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:5}
#pick h1{font-family:var(--serif);font-weight:400;font-size:26px;letter-spacing:.5px}
#pick h1 em{font-style:normal;color:var(--amber)}
#pick p{color:var(--mut);font-size:13px;max-width:260px;text-align:center;line-height:1.5}
.side{width:220px;padding:14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:16px;font-family:var(--serif)}
.side small{display:block;font-family:var(--sans);font-size:11px;color:var(--mut);margin-top:3px}
</style>
</head>
<body>
<div id="app">
  <div id="pick">
    <h1>Trap <em>Book</em></h1>
    <p>Mirror your rival's moves on the board. The book points the way while a trap is alive.</p>
    <button class="side" data-side="white">I play White<small>25 lines · 16 end in mate</small></button>
    <button class="side" data-side="black">I play Black<small>20 lines · 11 end in mate</small></button>
  </div>
  <header>
    <h1>Trap <em>Book</em></h1>
    <button id="undo">undo</button> <button id="reset">new game</button>
  </header>
  <div id="hunt"></div>
  <div id="boardwrap"><div id="board"></div></div>
  <div id="status">
    <div id="stateline"></div>
    <div id="mainline"></div>
  </div>
  <div id="opts"></div>
</div>

A40"},"Stafford Gambit Trap":{"pun":"Queen to h4 collapses the kingside","dec":"7. d4","verdict":"mate","eco":"C42"},"Mortimer Trap":{"pun":"5...c6 hits the bishop, then Qa5+ forks and wins the knight","dec":"6. Nc4","verdict":"+207cp","eco":"C65"},"Legal Trap":{"pun":"Mate with three minor pieces after the queen sacrifice","dec":"6...Nxe5","verdict":"mate","eco":"C41"},"Scholar's Mate":{"pun":"4. Qxf7#","dec":"3...g6","verdict":"mate","eco":"C20"},"Rubinstein Trap":{"pun":"14. Bc7 traps the queen on d8","dec":"13. Nxd5 anyway","verdict":"+507cp","eco":"D37"},"Halosar Trap":{"pun":"Queen sacrifice on b8 sets up smothered mate on c7","dec":"7...c6","verdict":"mate","eco":"D00"},"Monticelli Trap":{"pun":"10. Qxh7# - queen mates supported by the g5 knight","dec":"9...Nxe2+ is the refutation and wins for Black; 9...Bxg5 is roughly level","verdict":"mate","eco":"E11"},"Damiano Trap":{"pun":"4. Qh5+ then collect the rook on h8","dec":"2...Nc6","verdict":"+374cp","eco":"C40"},"Fried Liver Attack":{"pun":"King dragged to e6 and hunted down","dec":"5...Na5","verdict":"+86cp","eco":"C57"},"Caro-Kann Smothered Mate":{"pun":"6. Nd6# using the pin on the e-pawn","dec":"5...e6","verdict":"mate","eco":"B11"},"Tarrasch Trap (Open Variation)":{"pun":"12. Nxe6 wins a piece on the pins","dec":"11...Nxd4","verdict":"+372cp","eco":"C80"},"Tarrasch Trap (Steinitz Variation)":{"pun":"Wins a central pawn by force","dec":"7...exd4","verdict":"+165cp","eco":"C62"},"Wurzburger Trap":{"pun":"12. b3 cuts off the bishop's escape","dec":"11...Bg4","verdict":"+200cp","eco":"C29"},"Sicilian Delayed Alapin Trap":{"pun":"5. Qa4+ wins the knight by double attack","dec":"4...g6","verdict":"+287cp","eco":"B22"},"Greco Variation Trap (Italian)":{"pun":"Long forcing sequence starting 11. Bxf7+","dec":"10...d5","verdict":"+888cp","eco":"C54"},"Stafford Gambit (d3, queen grab)":{"pun":"7...Bxf2+ 8.Ke2 Bg4#","dec":"7. Be3 or 7. dxe4 avoid mate but Black stays fine","verdict":"mate","eco":"C42"},"Stafford Gambit (d3, knight grab)":{"pun":"7...Bxf2+ 8.Kxf2 Qxd1 wins the queen","dec":"7. Be3","verdict":"+604cp","eco":"C42"},"Traxler Counterattack":{"pun":"5...Bxf2+ 6.Kxf2 Nxe4+ then Qf6-f2#","dec":"5. Bxf7+ Ke7 is the critical test; position stays sharp","verdict":"mate","eco":"C57"},"Vienna Na4 Punishment":{"pun":"King hunt ending with the queen falling on e1 (+1197)","dec":"4. Ke2 avoids the worst but Black keeps a strong attack","verdict":"+1197cp","eco":"C25"},"King's Gambit Smothered Trap":{"pun":"7. Nf6# \u2014 the queen pin on e-file makes the smothered knight mate possible","dec":"6...Qe7 or 6...Be7 avoid it; position stays balanced","verdict":"mate","eco":"C33"},"Three Knights Fork Trick Trap":{"pun":"6.Qxd4 hits knight and g7; queen harvests both rooks and mates","dec":"5...Bd6 6.dxe5 Bxe5 leaves White a clean pawn up","verdict":"mate","eco":"C46"},"Petrov Copycat Trap":{"pun":"5.Nc6+ discovered check wins the queen","dec":"4...Qe7 5.Qxe4 d6 limits the damage to a pawn","verdict":"+596cp","eco":"C42"},"Wayward Queen Miniature":{"pun":"King is dragged across the board to mate on e2","dec":"2...Nc6 is the normal reply and refutes nothing but ends the show","verdict":"mate","eco":"C20"},"H-Pawn Punishment Miniature":{"pun":"Queen harvests the kingside and mates on f8","dec":"Any normal development by Black ends the line","verdict":"mate","eco":"B00"},"Englund Bc5 Queen Grab":{"pun":"5...Bxf2+ 6.Kxf2 Qxd1 wins the queen for a bishop","dec":"5. Bg5 or 5. e3 keep White fine","verdict":"+293cp","eco":"A40"},"Fool's Mate (delayed)":{"pun":"3...Qh4#","dec":"3. Nh3 covers the mate","verdict":"mate","eco":"A00"},"Wayward Queen Qf6 Miniature":{"pun":"Mate on e8 after the e7 bishop falls","dec":"2...Nc6 is the standard refutation of Qh5","verdict":"mate","eco":"C20"},"Traxler (Ke1 branch)":{"pun":"7...Qh4+ 8.Kf1 Qf2#","dec":"7. Kg1 Qh4 transposes to the main Traxler attack","verdict":"mate","eco":"C57"},"Grob Gambit Queen Trap":{"pun":"Bxf7+ deflects the king, Rg1 and Ng5+ n const GLYPH={K:'♚',Q:'♛',R:'♜',B:'♝',N:'♞',P:'♟'};
const $=s=>document.querySelector(s);
let side=null,tree=null,cur=null,sel=null,over=false,hist=[];

function startId(){return side+'|rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq -';}

function sqName(i){const r=8-Math.floor(i/8),f=i%8;return 'abcdefgh'[f]+r;}
function idxOf(name){const f='abcdefgh'.indexOf(name[0]),r=parseInt(name[1]);return (8-r)*8+f;}

function render(){
  const n=tree[cur];
  const bd=$('#board');bd.innerHTML='';
  const order=[...Array(64).keys()];
  const disp = side==='black'? order.map(i=>63-i):order;
  disp.forEach((i,pos)=>{
    const r=Math.floor(i/8),f=i%8;
    const d=document.createElement('div');
    d.className='sq '+(((r+f)%2)?'d':'l');
    d.dataset.i=i;
    const ch=n.board[i];
    if(ch!=='.'){
      const w=ch===ch.toUpperCase();
      d.classList.add(w?'w':'b');
      d.innerHTML='<span class="p">'+GLYPH[ch.toUpperCase()]+'</span>';
    }
    const dr=Math.floor(pos/8),dfp=pos%8;
    if(dfp===7)d.innerHTML+='<span class="coord cf">'+(side==='black'?r+1:8-dr)+'</span>';
    if(dr===7)d.innerHTML+='<span class="coord cr">'+('abcdefgh'[side==='black'?7-dfp:dfp])+'</span>';
    d.addEventListener('click',()=>tap(i));
    bd.appendChild(d);
  });
  paintState();
}

function paintState(){
  const n=tree[cur];
  const opts=$('#opts');opts.innerHTML='';
  const live=new Set();
  Object.values(n.moves).forEach(e=>e.traps.forEach(t=>live.add(t)));
  $('#hunt').innerHTML=[...live].map(t=>'<span class="tag'+(live.size<=2?' hot':'')+'">'+t+'</span>').join('');
  clearMarks();
  if(n.end){win(n.end);return;}
  if(over)return;
  const entries=Object.entries(n.moves);
  if(n.ours){
    $('#stateline').textContent='your move';
    entries.sort((a,b)=>(b[1].mate-a[1].mate)||(b[1].traps.length-a[1].traps.length));
    const top=entries[0];
    markHint(top[0]);
    $('#mainline').innerHTML='play <span class="mv">'+top[1].san+'</span>';
    if(entries.length>1){
      entries.forEach(([uci,e])=>{
        const b=document.createElement('button');b.className='opt';
        b.innerHTML='<span class="san">'+e.san+'</span><span class="tr">'+e.traps.join(', ')+'</span>'+(e.mate?'<span class="mate">MATE</span>':'');
        b.addEventListener('click',()=>advance(uci));
        opts.appendChild(b);
      });
    }
  }else{
    $('#stateline').textContent='rival moves — copy it here';
    $('#mainline').innerHTML='book expects: '+entries.map(([u,e])=>'<span class="mv">'+e.san+'</span>').join(' · ');
  }
}

function clearMarks(){document.querySelectorAll('.sq').forEach(s=>s.classList.remove('sel','hintfrom','hintto','from','to'));}
function markHint(uci){
  const f=idxOf(uci.slice(0,2)),t=idxOf(uci.slice(2,4));
  document.querySelector('.sq[data-i="'+f+'"]')?.classList.add('hintfrom');
  document.querySelector('.sq[data-i="'+t+'"]')?.classList.add('hintto');
}

function tap(i){
  if(over)return;
  const n=tree[cur];
  if(n.end)return;
  if(sel===null){
    if(n.board[i]==='.')return;
    sel=i;clearMarks();
    document.querySelector('.sq[data-i="'+i+'"]').classList.add('sel');
    if(n.ours){const hint=bestHint(n);if(hint)markHint(hint);}
  }else{
    const uci=sqName(sel)+sqName(i);
    sel=null;
    const match=Object.keys(n.moves).find(u=>u.slice(0,4)===uci);
    if(match){advance(match);}
    else if(n.ours){render();}
    else{deadEnd(uci);}
  }
}
function bestHint(n){
  const es=Object.entries(n.moves).sort((a,b)=>(b[1].mate-a[1].mate)||(b[1].traps.length-a[1].traps.length));
  return es.length?es[0][0]:null;
}
function advance(uci){
  hist.push(cur);
  const n=tree[cur];
  const rj=n.moves[uci].rejoin;
  cur=n.moves[uci].to;sel=null;
  render();
  if(rj){$('#stateline').textContent+=' · transposed back into book';}
}
function undo(){
  if(over){over=false;sel=null;render();return;}
  if(!hist.length)return;
  cur=hist.pop();sel=null;render();
}
function deadEnd(uci){
  over=true;
  const n=tree[cur];
  const hunted=new Set();
  Object.values(n.moves).forEach(e=>e.traps.forEach(t=>hunted.add(t)));
  let rows='';
  [...hunted].forEach(t=>{
    const info=DATA.traps[t]||{};
    if(info.dec) rows+='<p><b>'+t+':</b> '+info.dec+'</p>';
  });
  if(!rows) rows='<p>No stored fallback for the lines you were hunting.</p>';
  $('#opts').innerHTML='<div class="plate deadend"><h2>Off the book</h2><p>Rival played '+uci.slice(0,2)+'–'+uci.slice(2,4)+', outside every line here. Suggested continuations from the traps still alive:</p>'+rows+'<p>From here you are on your own.</p><button onclick="reset()">new game</button></div>';
  $('#stateline').textContent='dead end';$('#mainline').textContent='';
}
function win(name){
  over=true;
  const info=DATA.traps[name]||{};
  $('#stateline').textContent='trap sprung';$('#mainline').textContent='';
  $('#opts').innerHTML='<div class="plate win"><h2>'+name+'</h2><p>'+(info.pun||'')+'</p><button onclick="reset()">new game</button></div>';
}
function reset(){over=false;sel=null;hist=[];cur=startId();render();}

document.querySelectorAll('.side').forEach(b=>b.addEventListener('click',()=>{
  side=b.dataset.side;tree=DATA.trees[side];$('#pick').style.display='none';reset();
}));
$('#reset').addEventListener('click',()=>{ $('#pick').style.display='flex'; });
$('#undo').addEventListener('click',undo);
</script>
</body>
</html>
