<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#12161B">
<title>Trap Book</title>
<style>
:root{
  --bg:#12161B; --panel:#1B2129; --line:#2A323D;
  --bone:#DCD5C6; --slate:#5A6874;
  --ink:#E9E4DA; --mut:#8C96A2;
  --amber:#E3A83F; --amber-soft:rgba(227,168,63,.35);
  --red:#C05648; --green:#7FA86B; --blue:#5E87A8;
  --serif:Georgia,'Times New Roman',serif;
  --sans:-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;align-items:center;overflow:hidden}
#app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;overflow-y:auto;padding:10px 12px calc(90px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:baseline;padding:2px 2px 8px}
header h1{font-family:var(--serif);font-size:19px;font-weight:400;letter-spacing:.4px}
header h1 em{font-style:normal;color:var(--amber)}
header button{background:none;border:1px solid var(--line);color:var(--mut);font-size:12px;padding:4px 10px;border-radius:4px;font-family:var(--sans);margin-left:4px}
#hunt{display:flex;gap:6px;overflow-x:auto;padding:0 2px 8px;scrollbar-width:none;min-height:30px}
#hunt::-webkit-scrollbar{display:none}
.tag{flex:0 0 auto;font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:3px;padding:3px 7px;white-space:nowrap}
.tag.hot{color:var(--amber);border-color:var(--amber-soft)}
.tag.wander{color:var(--blue);border-color:var(--blue)}
#boardwrap{position:relative;width:100%;aspect-ratio:1/1}
#board{display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);width:100%;height:100%;border:1px solid var(--line)}
.sq{display:flex;align-items:center;justify-content:center;font-size:min(9.2vw,40px);line-height:1;position:relative;user-select:none}
.sq.l{background:var(--bone)}.sq.d{background:var(--slate)}
.sq .p{transform:translateY(-1px)}
.sq.w .p{color:#FAF7F0;text-shadow:0 1px 1px rgba(0,0,0,.55)}
.sq.b .p{color:#1A1E24;text-shadow:0 1px 1px rgba(255,255,255,.18)}
.sq.sel::after{content:'';position:absolute;inset:0;outline:3px solid var(--amber);outline-offset:-3px}
.sq.hintfrom::after{content:'';position:absolute;inset:0;outline:3px dashed var(--amber);outline-offset:-3px}
.sq.altfrom::after{content:'';position:absolute;inset:0;outline:2px dashed rgba(233,228,218,.45);outline-offset:-2px}
.sq.hintto::after{content:'';position:absolute;inset:0;background:var(--amber-soft)}
.sq.to-mate::after{content:'';position:absolute;inset:0;background:rgba(227,168,63,.38)}
.sq.to-qw::after{content:'';position:absolute;inset:0;background:rgba(94,135,168,.45)}
.sq.to-adv::after{content:'';position:absolute;inset:0;background:rgba(140,150,162,.35)}
.sq.to-safe::after{content:'';position:absolute;inset:0;background:rgba(127,168,107,.4)}
.coord{position:absolute;font-size:9px;color:rgba(0,0,0,.45);pointer-events:none}
.sq.d .coord{color:rgba(255,255,255,.4)}
.cf{right:2px;bottom:1px}.cr{left:2px;top:1px}
#status{padding:12px 2px 6px;min-height:56px}
#stateline{color:var(--mut);letter-spacing:.3px;text-transform:uppercase;font-size:11px}
#mainline{font-family:var(--serif);font-size:17px;margin-top:3px}
#mainline .mv{color:var(--amber);cursor:pointer;text-decoration:underline;text-decoration-color:rgba(227,168,63,.4);text-underline-offset:3px}
#opts{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.opt{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;text-align:left;color:var(--ink);font-family:var(--sans);width:100%}
.opt:active{border-color:var(--amber)}
.opt .san{font-family:var(--serif);font-size:18px;color:var(--amber);min-width:52px}
.opt .tr{font-size:12px;color:var(--mut);flex:1}
.opt .mate{font-size:10px;color:var(--bg);background:var(--amber);border-radius:3px;padding:2px 5px;letter-spacing:.5px}
.opt .qw{font-size:10px;color:var(--bg);background:var(--blue);border-radius:3px;padding:2px 5px;letter-spacing:.5px}
.opt .adv{font-size:10px;color:var(--ink);background:var(--line);border-radius:3px;padding:2px 5px;letter-spacing:.5px}
.opt .safe{font-size:10px;color:var(--bg);background:var(--green);border-radius:3px;padding:2px 5px;letter-spacing:.5px}
.plate{margin-top:8px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:6px;padding:12px 14px}
.plate.deadend{border-left-color:var(--red)}
.plate.win{border-left-color:var(--green)}
.plate.back{border-left-color:var(--blue)}
.plate h2{font-family:var(--serif);font-weight:400;font-size:18px;margin-bottom:4px}
.plate p{font-size:13px;color:var(--mut);line-height:1.45;margin-top:4px}
.plate button{margin-top:10px;background:var(--amber);border:none;color:var(--bg);font-size:13px;padding:8px 14px;border-radius:5px;font-family:var(--sans);margin-right:6px}
.plate button.ghostbtn{background:none;border:1px solid var(--line);color:var(--mut)}
#pick{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:5}
#pick h1{font-family:var(--serif);font-weight:400;font-size:26px;letter-spacing:.5px}
#pick h1 em{font-style:normal;color:var(--amber)}
#pick p{color:var(--mut);font-size:13px;max-width:260px;text-align:center;line-height:1.5}
.side{width:220px;padding:14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:16px;font-family:var(--serif)}
.side small{display:block;font-family:var(--sans);font-size:11px;color:var(--mut);margin-top:3px}
</style>
</head>
<body>
<div id="app">
  <div id="pick">
    <h1>Trap <em>Book</em></h1>
    <p>Mirror your rival's moves on the board. The book points the way while a trap is alive — and keeps watching for a way back if the game wanders.</p>
    <button class="side" data-side="white">I play White<small>44 lines · 26 end in mate</small></button>
    <button class="side" data-side="black">I play Black<small>25 lines · 14 end in mate</small></button>
  </div>
  <header>
    <h1>Trap <em>Book</em></h1>
    <div><button id="undo">undo</button><button id="reset">new game</button></div>
  </header>
  <div id="hunt"></div>
  <div id="boardwrap"><div id="board"></div></div>
  <div id="status">
    <div id="stateline"></div>
    <div id="mainline"></div>
  </div>
  <div id="opts"></div>
</div>

se},"Anti-h6 Bxf7 Hunt (Kf6 branch)":{"pun":"9.Qf7 nets the wandering king in an attack \u2014 small but lasting edge","dec":"If rival plays 7...Ke8 instead, mate follows via Qh5+ (see the Ke8 branch)","verdict":"+104cp","eco":"C41","qwin":false,"safe":false},"Anti-h6 Bxf7 Hunt (Ke8 mate)":{"pun":"8.Qh5+ Ke7 9.Qf7#","dec":"If rival plays 7...Kf6 instead, chase with Qf3+ (see the Kf6 branch)","verdict":"mate","eco":"C41","qwin":false,"safe":false},"Two Knights d5 Fork":{"pun":"5...d5 forks bishop and knight \u2014 Black regains the piece with an edge","dec":"If rival plays 5.Nxf7 instead, the Qh4 mating attack applies (see sibling line)","verdict":"+128cp","eco":"C57","qwin":false,"safe":false},"Two Knights Nxf7 Punishment":{"pun":"Qh4-e4 sweeps the long diagonal; Qxh1+ and Qxf1#","dec":"If rival plays 6.d4 or 6.Qe2 instead, Black stays active \u2014 develop and castle long","verdict":"mate","eco":"C57","qwin":false,"safe":false},"Vienna Gambit c7 Fork (Qd8 branch)":{"pun":"8.Nxc7+ forks; 9.exd6+ uncovers on the queen \u2014 decisive advantage","dec":"If rival plays 7...Qd7 instead, the same fork works (see sibling branch)","verdict":"+633cp","eco":"C29","qwin":false,"safe":false},"Tennison Gambit Queen Grab":{"pun":"6.Nxf7! Kxf7 7.Bg6+! deflects the king off the queen \u2014 Qxd8","dec":"If rival plays 5...Nc6 or 5...e5 instead, the trick is off \u2014 develop normally, roughly level","verdict":"+295cp","eco":"A06","qwin":true,"safe":false},"Najdorf Polugaevsky Defense":{"pun":"9...Qc7 and 10...Nfd7 hold everything together \u2014 attack defused, position playable","dec":"If White avoids 8.e5, develop normally \u2014 the b5 space is yours","verdict":"-50cp","eco":"B96","qwin":false,"safe":true},"Caro-Kann Qd8 Queen Sac Mate":{"pun":"9.Qd8+!! Kxd8 10.Bg5+ and the bishop returns to d8 for mate","dec":"If rival plays 8...Be7 instead, keep developing \u2014 pressure on the d-file persists","verdict":"mate","eco":"B15","qwin":false,"safe":false},"Danish Qb3 Grind":{"pun":"The queens raid opposite wings; 13.Nf6+ and 14.Bh6+ leave White up material","dec":"If rival plays 8...Nd8 holding f7 and g7, develop with pressure \u2014 nothing forced","verdict":"+151cp","eco":"C21","qwin":false,"safe":false}}};
const GLYPH={K:'♚',Q:'♛',R:'♜',B:'♝',N:'♞',P:'♟'};
const $=s=>document.querySelector(s);

let side=null,tree=null,cur=null,sel=null,over=false;
let mode='book';           // 'book' | 'wander'
let W=null;                // wander state {bd:string64, turn:'w'|'b', castle:'KQkq'|'-', ep:'-'|sq}
let hist=[];               // [{mode:'book',cur} | {mode:'wander',W}]
let banner=null;           // transient plate html

function startId(){return side+'|rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq -';}
function sqName(i){const r=8-Math.floor(i/8),f=i%8;return 'abcdefgh'[f]+r;}
function idxOf(name){const f='abcdefgh'.indexOf(name[0]),r=parseInt(name[1]);return (8-r)*8+f;}

function keyFields(id){const p=id.split('|')[1].split(' ');return {plc:p[0],turn:p[1],castle:p[2],ep:p[3]};}
function boardTo64(plc){
  let s='';
  for(const row of plc.split('/')){
    for(const ch of row){ s+= /\d/.test(ch)? '.'.repeat(+ch) : ch; }
  }
  return s;
}
function b64ToPlc(bd){
  const rows=[];
  for(let r=0;r<8;r++){
    let row='',run=0;
    for(let f=0;f<8;f++){
      const c=bd[r*8+f];
      if(c==='.')run++;
      else{ if(run){row+=run;run=0;} row+=c; }
    }
    if(run)row+=run;
    rows.push(row);
  }
  return rows.join('/');
}
function nodeBoard(n){return n.board;}

function render(){
  const bd = mode==='wander' ? W.bd : nodeBoard(tree[cur]);
  const el=$('#board');el.innerHTML='';
  const order=[...Array(64).keys()];
  const disp = side==='black'? order.map(i=>63-i):order;
  disp.forEach((i,pos)=>{
    const r=Math.floor(i/8),f=i%8;
    const d=document.createElement('div');
    d.className='sq '+(((r+f)%2)?'d':'l');
    d.dataset.i=i;
    const ch=bd[i];
    if(ch!=='.'){
      const w=ch===ch.toUpperCase();
      d.classList.add(w?'w':'b');
      d.innerHTML='<span class="p">'+GLYPH[ch.toUpperCase()]+'</span>';
    }
    const dr=Math.floor(pos/8),dfp=pos%8;
    if(dfp===7)d.innerHTML+='<span class="coord cf">'+(side==='black'?dr+1:8-dr)+'</span>';
    if(dr===7)d.innerHTML+='<span class="coord cr">'+('abcdefgh'[side==='black'?7-dfp:dfp])+'</span>';
    d.addEventListener('click',()=>tap(i));
    el.appendChild(d);
  });
  paintState();
}

function clearMarks(){document.querySelectorAll('.sq').forEach(s=>s.classList.remove('sel','hintfrom','hintto','altfrom','to-mate','to-qw','to-adv'));}
function sortedEntries(n){
  return Object.entries(n.moves).sort((a,b)=>(b[1].mate-a[1].mate)||((b[1].qwin?1:0)-(a[1].qwin?1:0))||(b[1].traps.length-a[1].traps.length));
}
function markAll(n,filterFrom){
  const es=sortedEntries(n);
  es.forEach(([uci,e],idx)=>{
    const f=idxOf(uci.slice(0,2)),t=idxOf(uci.slice(2,4));
    if(filterFrom!==undefined && f!==filterFrom) return;
    const fEl=document.querySelector('.sq[data-i="'+f+'"]');
    const tEl=document.querySelector('.sq[data-i="'+t+'"]');
    if(fEl)fEl.classList.add(idx===0?'hintfrom':'altfrom');
    if(tEl)tEl.classList.add(e.mate?'to-mate':(e.qwin?'to-qw':(e.safe?'to-safe':'to-adv')));
  });
}

function paintState(){
  const opts=$('#opts');opts.innerHTML=banner||'';
  clearMarks();
  if(mode==='wander'){
    $('#hunt').innerHTML='<span class="tag wander">off book — watching for a way back</span>';
    $('#stateline').textContent=(W.turn==='w'?'white':'black')+' to move · mirror the game';
    $('#mainline').textContent='';
    return;
  }
  const n=tree[cur];
  const live=new Set();
  Object.values(n.moves).forEach(e=>e.traps.forEach(t=>live.add(t)));
  $('#hunt').innerHTML=[...live].map(t=>'<span class="tag'+(live.size<=2?' hot':'')+'">'+t+'</span>').join('');
  if(n.end){win(n.end);return;}
  if(over)return;
  const entries=Object.entries(n.moves);
  if(n.ours){
    $('#stateline').textContent='your move';
    entries.sort((a,b)=>(b[1].mate-a[1].mate)||((b[1].qwin?1:0)-(a[1].qwin?1:0))||(b[1].traps.length-a[1].traps.length));
    const top=entries[0];
    markAll(n);
    $('#mainline').innerHTML='play <span class="mv" data-uci="'+top[0]+'">'+top[1].san+'</span>';
    if(entries.length>1){
      entries.forEach(([uci,e])=>{
        const b=document.createElement('button');b.className='opt';
        const tl=e.traps.length>4? e.traps.length+' traps' : e.traps.join(', ');
        b.innerHTML='<span class="san">'+e.san+'</span><span class="tr">'+tl+'</span>'+(e.mate?'<span class="mate">MATE</span>':(e.qwin?'<span class="qw">QUEEN</span>':(e.safe?'<span class="safe">SAFE</span>':(e.adv?'<span class="adv">ADV</span>':''))));
        b.addEventListener('click',()=>advance(uci));
        opts.appendChild(b);
      });
    }
  }else{
    $('#stateline').textContent='rival moves — copy it here';
    markAll(n);
    $('#mainline').innerHTML='book expects: '+entries.map(([u,e])=>'<span class="mv" data-uci="'+u+'">'+e.san+'</span>').join(' · ');
  }
}

function pushHist(){
  if(mode==='book')hist.push({mode:'book',cur});
  else hist.push({mode:'wander',W:JSON.parse(JSON.stringify(W))});
}

function tap(i){
  if(over)return;
  if(mode==='book'){
    const n=tree[cur];
    if(n.end)return;
    if(sel===null){
      if(nodeBoard(n)[i]==='.')return;
      sel=i;clearMarks();
      document.querySelector('.sq[data-i="'+i+'"]').classList.add('sel');
      if(n.ours){markAll(n,i);}
    }else{
      const uci=sqName(sel)+sqName(i); sel=null;
      const match=Object.keys(n.moves).find(u=>u.slice(0,4)===uci);
      if(match){advance(match);}
      else if(n.ours){render();}
      else{enterWander(uci);}
    }
  }else{ // wander
    if(sel===null){
      if(W.bd[i]==='.')return;
      sel=i;clearMarks();
      document.querySelector('.sq[data-i="'+i+'"]').classList.add('sel');
    }else{
      const from=sel,to=i; sel=null;
      if(from===to){render();return;}
      pushHist();
      banner=null;
      wanderMove(from,to);
      const back=lookup();
      if(back){
        mode='book';cur=back;W=null;
        banner='<div class="plate back"><h2>Back in the book</h2><p>The position matches a known trap line again. The hunt resumes.</p></div>';
        render(); banner=null;
        return;
      }
      render();
    }
  }
}

function applyMove(bd,from,to){
  let b=bd.split('');
  const p=b[from];
  if((p==='p'||p==='P') && (from%8)!==(to%8) && b[to]==='.'){
    b[Math.floor(from/8)*8+(to%8)]='.';           // en passant capture
  }
  if((p==='k'||p==='K') && Math.abs((from%8)-(to%8))===2){
    const row=Math.floor(from/8);
    if((to%8)===6){ b[row*8+5]=b[row*8+7]; b[row*8+7]='.'; }
    else { b[row*8+3]=b[row*8+0]; b[row*8+0]='.'; }
  }
  b[to]=p; b[from]='.';
  // promotion: default to queen
  if(p==='P' && Math.floor(to/8)===0) b[to]='Q';
  if(p==='p' && Math.floor(to/8)===7) b[to]='q';
  return b.join('');
}

function wanderMove(from,to){
  const p=W.bd[from];
  W.bd=applyMove(W.bd,from,to);
  // castling rights
  let c=W.castle==='-'?'':W.castle;
  const drop=ch=>{c=c.replace(ch,'');};
  if(p==='K'){drop('K');drop('Q');}
  if(p==='k'){drop('k');drop('q');}
  const touch=sq=>{
    if(sq===63)drop('K'); if(sq===56)drop('Q');   // h1,a1
    if(sq===7)drop('k');  if(sq===0)drop('q');    // h8,a8
  };
  touch(from);touch(to);
  W.castle=c||'-';
  // en passant target: pawn double push with adjacent enemy pawn
  W.ep='-';
  if((p==='P'||p==='p') && Math.abs(Math.floor(from/8)-Math.floor(to/8))===2){
    const midRow=(Math.floor(from/8)+Math.floor(to/8))/2, f=to%8;
    const enemy=p==='P'?'p':'P';
    if((f>0&&W.bd[Math.floor(to/8)*8+f-1]===enemy)||(f<7&&W.bd[Math.floor(to/8)*8+f+1]===enemy)){
      W.ep='abcdefgh'[f]+(8-midRow);
    }
  }
  W.turn=W.turn==='w'?'b':'w';
}

function lookup(){
  const plc=b64ToPlc(W.bd);
  const base=side+'|'+plc+' '+W.turn+' '+W.castle+' ';
  if(W.ep!=='-' && tree[base+W.ep]) return base+W.ep;
  if(tree[base+'-']) return base+'-';
  return null;
}

function advance(uci){
  pushHist();
  const n=tree[cur];
  const rj=n.moves[uci].rejoin;
  cur=n.moves[uci].to;sel=null;banner=null;
  render();
  if(rj){$('#stateline').textContent+=' · transposed back into book';}
}

function enterWander(uci){
  pushHist();
  const n=tree[cur];
  const kf=keyFields(cur);
  W={bd:nodeBoard(n),turn:kf.turn,castle:kf.castle,ep:kf.ep};
  const from=idxOf(uci.slice(0,2)),to=idxOf(uci.slice(2,4));
  wanderMove(from,to);
  mode='wander';
  const back=lookup();
  if(back){ mode='book';cur=back;W=null;
    banner='<div class="plate back"><h2>Transposed</h2><p>That move lands on a known book position — the hunt continues.</p></div>';
    render(); banner=null; return;
  }
  banner='<div class="plate deadend"><h2>Off the book</h2><p>Keep mirroring both sides. If the game returns to a known position, the book picks it up again.</p></div>';
  render();
}

function undo(){
  if(!hist.length)return;
  const h=hist.pop();
  banner=null;over=false;sel=null;
  if(h.mode==='book'){mode='book';cur=h.cur;W=null;}
  else{mode='wander';W=h.W;}
  render();
}
function win(name){
  over=true;
  const info=DATA.traps[name]||{};
  const kind = info.verdict==='mate' ? 'Checkmate' : (info.qwin ? 'Queen won' : (info.safe ? 'Defused' : 'Advantage'));
  $('#stateline').textContent='trap sprung · '+kind.toLowerCase();$('#mainline').textContent='';
  $('#opts').innerHTML='<div class="plate win"><h2>'+kind+' — '+name+'</h2><p>'+(info.pun||'')+'</p><button onclick="reset()">new game</button></div>';
}
function reset(){over=false;sel=null;mode='book';W=null;banner=null;hist=[];cur=startId();render();}

document.querySelectorAll('.side').forEach(b=>b.addEventListener('click',()=>{
  side=b.dataset.side;tree=DATA.trees[side];$('#pick').style.display='none';reset();
}));
$('#reset').addEventListener('click',()=>{ $('#pick').style.display='flex'; });
$('#undo').addEventListener('click',undo);
$('#mainline').addEventListener('click',ev=>{const t=ev.target.closest('.mv');if(t&&t.dataset.uci&&mode==='book'&&!over)advance(t.dataset.uci);});
</script>
</body>
</html>
