<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#12161B">
<title>Trap Book</title>
<style>
:root{
  --bg:#12161B; --panel:#1B2129; --line:#2A323D;
  --bone:#DCD5C6; --slate:#5A6874;
  --ink:#E9E4DA; --mut:#8C96A2;
  --amber:#E3A83F; --amber-soft:rgba(227,168,63,.35);
  --red:#C05648; --green:#7FA86B; --blue:#5E87A8;
  --serif:Georgia,'Times New Roman',serif;
  --sans:-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;align-items:center;overflow:hidden}
#app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;overflow-y:auto;padding:10px 12px calc(90px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:baseline;padding:2px 2px 8px}
header h1{font-family:var(--serif);font-size:19px;font-weight:400;letter-spacing:.4px}
header h1 em{font-style:normal;color:var(--amber)}
header button{background:none;border:1px solid var(--line);color:var(--mut);font-size:12px;padding:4px 10px;border-radius:4px;font-family:var(--sans);margin-left:4px}
#hunt{display:flex;gap:6px;overflow-x:auto;padding:0 2px 8px;scrollbar-width:none;min-height:30px}
#hunt::-webkit-scrollbar{display:none}
#hunt.open{flex-wrap:wrap;overflow-x:visible}
#hunt .tn{cursor:pointer;text-decoration:underline;text-decoration-color:rgba(227,168,63,.35);text-underline-offset:3px}
#hunt .cnt{cursor:pointer;font-weight:700}
.trapcard p{margin:6px 0;font-size:13px;line-height:1.45}
.trapcard .line{color:var(--mut);word-break:break-word}
.trapcard button{margin-top:8px;padding:6px 14px;border:1px solid var(--mut);border-radius:6px;background:transparent;color:inherit}
.tag{flex:0 0 auto;font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:3px;padding:3px 7px;white-space:nowrap}
.tag.hot{color:var(--amber);border-color:var(--amber-soft)}
.tag.wander{color:var(--blue);border-color:var(--blue)}
#boardwrap{position:relative;width:100%;aspect-ratio:1/1}
#board{display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);width:100%;height:100%;border:1px solid var(--line)}
.sq{display:flex;align-items:center;justify-content:center;font-size:min(9.2vw,40px);line-height:1;position:relative;user-select:none}
.sq.l{background:var(--bone)}.sq.d{background:var(--slate)}
.sq .p{transform:translateY(-1px)}
.sq.w .p{color:#FAF7F0;text-shadow:0 1px 1px rgba(0,0,0,.55)}
.sq.b .p{color:#1A1E24;text-shadow:0 1px 1px rgba(255,255,255,.18)}
.sq.sel::after{content:'';position:absolute;inset:0;outline:3px solid var(--amber);outline-offset:-3px}
.sq.hintfrom::after{content:'';position:absolute;inset:0;outline:3px dashed var(--amber);outline-offset:-3px}
.sq.altfrom::after{content:'';position:absolute;inset:0;outline:2px dashed rgba(233,228,218,.45);outline-offset:-2px}
.sq.hintto::after{content:'';position:absolute;inset:0;background:var(--amber-soft)}
.sq.to-mate::after{content:'';position:absolute;inset:0;background:rgba(227,168,63,.38)}
.sq.to-qw::after{content:'';position:absolute;inset:0;background:rgba(94,135,168,.45)}
.sq.to-adv::after{content:'';position:absolute;inset:0;background:rgba(140,150,162,.35)}
.sq.to-safe::after{content:'';position:absolute;inset:0;background:rgba(127,168,107,.4)}
.coord{position:absolute;font-size:9px;color:rgba(0,0,0,.45);pointer-events:none}
.sq.d .coord{color:rgba(255,255,255,.4)}
.cf{right:2px;bottom:1px}.cr{left:2px;top:1px}
#status{padding:12px 2px 6px;min-height:56px}
#stateline{color:var(--mut);letter-spacing:.3px;text-transform:uppercase;font-size:11px}
#mainline{font-family:var(--serif);font-size:17px;margin-top:3px}
#mainline small .tn{cursor:pointer;text-decoration:underline;text-decoration-color:rgba(227,168,63,.35);text-underline-offset:2px}
#mainline .mv{color:var(--amber);cursor:pointer;text-decoration:underline;text-decoration-color:rgba(227,168,63,.4);text-underline-offset:3px}
#opts{display:flex;flex-direction:column;gap:6px;padding-top:6px}
#palette{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
#palette button{font-size:22px;line-height:1;padding:6px 9px;border:1px solid var(--mut);border-radius:6px;background:transparent}
#palette button.w{color:#fff;text-shadow:0 0 2px #000}
#palette button.b{color:#111;background:#d8d2c5}
#palette button.on{outline:2px solid var(--acc,#e8a33d)}
.setrow{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;font-size:13px}
.setrow button{padding:5px 10px;border:1px solid var(--mut);border-radius:6px;background:transparent;color:inherit}
.setrow button.on{outline:2px solid var(--acc,#e8a33d)}
.setrow .go{font-weight:700}
.opt{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;text-align:left;color:var(--ink);font-family:var(--sans);width:100%}
.opt:active{border-color:var(--amber)}
.opt .san{font-family:var(--serif);font-size:18px;color:var(--amber);min-width:52px}
.opt .tr{font-size:12px;color:var(--mut);flex:1}
.opt .mate{font-size:10px;color:var(--bg);background:var(--amber);border-radius:3px;padding:2px 5px;letter-spacing:.5px}
.opt .qw{font-size:10px;color:var(--bg);background:var(--blue);border-radius:3px;padding:2px 5px;letter-spacing:.5px}
.opt .adv{font-size:10px;color:var(--ink);background:var(--line);border-radius:3px;padding:2px 5px;letter-spacing:.5px}
.opt .safe{font-size:10px;color:var(--bg);background:var(--green);border-radius:3px;padding:2px 5px;letter-spacing:.5px}
.plate{margin-top:8px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:6px;padding:12px 14px}
.plate.deadend{border-left-color:var(--red)}
.plate.win{border-left-color:var(--green)}
.plate.back{border-left-color:var(--blue)}
.plate h2{font-family:var(--serif);font-weight:400;font-size:18px;margin-bottom:4px}
.plate p{font-size:13px;color:var(--mut);line-height:1.45;margin-top:4px}
.plate button{margin-top:10px;background:var(--amber);border:none;color:var(--bg);font-size:13px;padding:8px 14px;border-radius:5px;font-family:var(--sans);margin-right:6px}
.plate button.ghostbtn{background:none;border:1px solid var(--line);color:var(--mut)}
#pick{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:5}
#pick h1{font-family:var(--serif);font-weight:400;font-size:26px;letter-spacing:.5px}
#pick h1 em{font-style:normal;color:var(--amber)}
#pick p{color:var(--mut);font-size:13px;max-width:260px;text-align:center;line-height:1.5}
.side{width:220px;padding:14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:16px;font-family:var(--serif)}
.side small{display:block;font-family:var(--sans);font-size:11px;color:var(--mut);margin-top:3px}
</style>
</head>
<body>
<div id="app">
  <div id="pick">
    <h1>Trap <em>Book</em></h1>
    <p>Mirror your rival's moves on the board. The book points the way while a trap is alive — and keeps watching for a way back if the game wanders.</p>
    <button class="side" data-side="white">I play White<small>51 lines · 29 end in mate</small></button>
    <button class="side" data-side="black">I play Black<small>27 lines · 15 end in mate</small></button>
  </div>
  <header>
    <h1>Trap <em>Book</em></h1>
    <div><button id="setup">set up</button><button id="undo">undo</button><button id="reset">new game</button></div>
  </header>
  <div id="hunt"></div>
  <div id="boardwrap"><div id="board"></div></div>
  <div id="status">
    <div id="stateline"></div>
    <div id="mainline"></div>
  </div>
  <div id="opts"></div>
</div>

const GLYPH={K:'♚',Q:'♛',R:'♜',B:'♝',N:'♞',P:'♟'};
const $=s=>document.querySelector(s);

let side=null,tree=null,cur=null,sel=null,over=false;
let mode='book';           // 'book' | 'wander'
let W=null;                // wander state {bd:string64, turn:'w'|'b', castle:'KQkq'|'-', ep:'-'|sq}
let S=null;                // setup state {bd, turn, castle, manual, pal}
let hist=[];               // [{mode:'book',cur} | {mode:'wander',W}]
let banner=null;           // transient plate html

function startId(){return side+'|rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq -';}
function sqName(i){const r=8-Math.floor(i/8),f=i%8;return 'abcdefgh'[f]+r;}
function idxOf(name){const f='abcdefgh'.indexOf(name[0]),r=parseInt(name[1]);return (8-r)*8+f;}

function keyFields(id){const p=id.split('|')[1].split(' ');return {plc:p[0],turn:p[1],castle:p[2],ep:p[3]};}
function boardTo64(plc){
  let s='';
  for(const row of plc.split('/')){
    for(const ch of row){ s+= /\d/.test(ch)? '.'.repeat(+ch) : ch; }
  }
  return s;
}
function b64ToPlc(bd){
  const rows=[];
  for(let r=0;r<8;r++){
    let row='',run=0;
    for(let f=0;f<8;f++){
      const c=bd[r*8+f];
      if(c==='.')run++;
      else{ if(run){row+=run;run=0;} row+=c; }
    }
    if(run)row+=run;
    rows.push(row);
  }
  return rows.join('/');
}
function nodeBoard(n){return n.board;}

function render(){
  const bd = mode==='setup' ? S.bd : (mode==='wander' ? W.bd : nodeBoard(tree[cur]));
  const el=$('#board');el.innerHTML='';
  const order=[...Array(64).keys()];
  const disp = side==='black'? order.map(i=>63-i):order;
  disp.forEach((i,pos)=>{
    const r=Math.floor(i/8),f=i%8;
    const d=document.createElement('div');
    d.className='sq '+(((r+f)%2)?'d':'l');
    d.dataset.i=i;
    const ch=bd[i];
    if(ch!=='.'){
      const w=ch===ch.toUpperCase();
      d.classList.add(w?'w':'b');
      d.innerHTML='<span class="p">'+GLYPH[ch.toUpperCase()]+'</span>';
    }
    const dr=Math.floor(pos/8),dfp=pos%8;
    if(dfp===7)d.innerHTML+='<span class="coord cf">'+(side==='black'?dr+1:8-dr)+'</span>';
    if(dr===7)d.innerHTML+='<span class="coord cr">'+('abcdefgh'[side==='black'?7-dfp:dfp])+'</span>';
    d.addEventListener('click',()=>tap(i));
    el.appendChild(d);
  });
  paintState();
}

function clearMarks(){document.querySelectorAll('.sq').forEach(s=>s.classList.remove('sel','hintfrom','hintto','altfrom','to-mate','to-qw','to-adv'));}
function sortedEntries(n){
  return Object.entries(n.moves).sort((a,b)=>(b[1].mate-a[1].mate)||((b[1].qwin?1:0)-(a[1].qwin?1:0))||(b[1].traps.length-a[1].traps.length));
}
function markAll(n,filterFrom){
  const es=sortedEntries(n);
  es.forEach(([uci,e],idx)=>{
    const f=idxOf(uci.slice(0,2)),t=idxOf(uci.slice(2,4));
    if(filterFrom!==undefined && f!==filterFrom) return;
    const fEl=document.querySelector('.sq[data-i="'+f+'"]');
    const tEl=document.querySelector('.sq[data-i="'+t+'"]');
    if(fEl)fEl.classList.add(idx===0?'hintfrom':'altfrom');
    if(tEl)tEl.classList.add(e.mate?'to-mate':(e.qwin?'to-qw':(e.safe?'to-safe':'to-adv')));
  });
}

function paintState(){

    'KQRBNP'.split('').forEach(u=>{

        b.textContent=GLYPH[u];

      });
    });

    });
    opts.appendChild(row1);
    const row2=document.createElement('div');row2.className='setrow';
    const clab={'K':'O-O w','Q':'O-O-O w','k':'O-O b','q':'O-O-O b'};
    'KQkq'.split('').forEach(ch=>{
      const b=document.createElement('button');

      b.addEventListener('click',()=>{
        S.manual=true;
        S.castle=S.castle.includes(ch)?(S.castle.replace(ch,'')||'-'):('KQkq'.split('').filter(c=>c===ch||S.castle.includes(c)).join(''));
        render();
      });
      row2.appendChild(b);
    });
    opts.appendChild(row2);
    const row3=document.createElement('div');row3.className='setrow';
    const done=document.createElement('button');done.className='go';done.textContent='done — play from here';
    done.addEventListener('click',setupDone);
    const clr=document.createElement('button');clr.textContent='empty board';
    clr.addEventListener('click',()=>{S.bd='.'.repeat(64);if(!S.manual)S.castle='-';sel=null;render();});
    const strt=document.createElement('button');strt.textContent='start position';
    strt.addEventListener('click',()=>{S.bd=boardTo64('rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR');if(!S.manual)S.castle='KQkq';sel=null;render();});
    const cnc=document.createElement('button');cnc.textContent='cancel';
    cnc.addEventListener('click',undo);
    row3.appendChild(done);row3.appendChild(strt);row3.appendChild(clr);row3.appendChild(cnc);
    opts.appendChild(row3);
    if(sel!==null){const q=document.querySelector('.sq[data-i="'+sel+'"]');if(q)q.classList.add('sel');}
    return;
  }
  if(mode==='wander'){
    $('#hunt').innerHTML='<span class="tag wander">off book — watching for a way back</span>';
    $('#stateline').textContent=(W.turn==='w'?'white':'black')+' to move · mirror the game';
    if(!over){
      const cps=compass();
      if(cps.length){
        const mine=W.turn===(side==='white'?'w':'b');
        $('#mainline').innerHTML=(mine?'steer back: ':'book returns if rival plays: ')+
          cps.map(c=>{
            const tl=c.traps.size>2? c.traps.size+' traps' : [...c.traps].map(t=>'<span class="tn" data-trap="'+t.replace(/"/g,'&quot;')+'">'+t+'</span>').join(', ');
            return '<span class="mv" data-uci="'+c.uci+'">'+c.san+'</span> <small>('+tl+(c.dist===2?' · in 2':'')+')</small>';
          }).join(' · ');
      } else $('#mainline').textContent='no book position within 2 moves';
    } else $('#mainline').textContent='';
    return;
  }
  const n=tree[cur];
  const live=new Set();
  Object.values(n.moves).forEach(e=>e.traps.forEach(t=>live.add(t)));
  renderHunt([...live]);
  if(n.end){win(n.end);return;}
  if(over)return;
  const entries=Object.entries(n.moves);
  if(n.ours){
    $('#stateline').textContent='your move';
    entries.sort((a,b)=>(b[1].mate-a[1].mate)||((b[1].qwin?1:0)-(a[1].qwin?1:0))||(b[1].traps.length-a[1].traps.length));
    const top=entries[0];
    markAll(n);
    $('#mainline').innerHTML='play <span class="mv" data-uci="'+top[0]+'">'+top[1].san+'</span>';
    if(entries.length>1){
      entries.forEach(([uci,e])=>{
        const b=document.createElement('button');b.className='opt';
        const tl=e.traps.length>4? e.traps.length+' traps' : e.traps.join(', ');
        b.innerHTML='<span class="san">'+e.san+'</span><span class="tr">'+tl+'</span>'+(e.mate?'<span class="mate">MATE</span>':(e.qwin?'<span class="qw">QUEEN</span>':(e.safe?'<span class="safe">SAFE</span>':(e.adv?'<span class="adv">ADV</span>':''))));
        b.addEventListener('click',()=>advance(uci));
        opts.appendChild(b);
      });
    }
  }else{
    $('#stateline').textContent='rival moves — copy it here';
    markAll(n);
    $('#mainline').innerHTML='book expects: '+entries.map(([u,e])=>'<span class="mv" data-uci="'+u+'">'+e.san+'</span>').join(' · ');
  }
}

let huntOpen=false;
function renderHunt(names){
  const h=$('#hunt');
  h.classList.toggle('open',huntOpen);
  let html='';
  if(names.length>4)html+='<span class="tag cnt">'+names.length+' traps '+(huntOpen?'▴':'▾')+'</span>';
  html+=names.map(t=>'<span class="tag tn'+(names.length<=2?' hot':'')+'" data-trap="'+t.replace(/"/g,'&quot;')+'">'+t+'</span>').join('');
  h.innerHTML=html;
}
function trapCard(name){
  const info=DATA.traps[name]||{};
  const kindTag=info.verdict==='mate'?'<span class="mate">MATE</span>':(info.qwin?'<span class="qw">QUEEN</span>':(info.safe?'<span class="safe">SAFE</span>':'<span class="adv">ADV</span>'));

  document.getElementById('tcback').addEventListener('click',()=>{render();});
}
function pushHist(){
  if(mode==='book')hist.push({mode:'book',cur});
  else hist.push({mode:'wander',W:JSON.parse(JSON.stringify(W))});
}

function tap(i){
  if(over)return;
  if(mode==='setup'){setupTap(i);return;}
  if(mode==='book'){
    const n=tree[cur];
    if(n.end)return;
    if(sel===null){
      if(nodeBoard(n)[i]==='.')return;
      sel=i;clearMarks();
      document.querySelector('.sq[data-i="'+i+'"]').classList.add('sel');
      if(n.ours){markAll(n,i);}
    }else{
      const uci=sqName(sel)+sqName(i); sel=null;
      const match=Object.keys(n.moves).find(u=>u.slice(0,4)===uci);
      if(match){advance(match);}
      else if(n.ours){render();}
      else{enterWander(uci);}
    }
  }else{ // wander
    if(sel===null){
      if(W.bd[i]==='.')return;
      sel=i;clearMarks();
      document.querySelector('.sq[data-i="'+i+'"]').classList.add('sel');
    }else{
      const from=sel,to=i; sel=null;
      if(from===to){render();return;}
      pushHist();
      banner=null;
      wanderMove(from,to);
      const back=lookup();
      if(back){
        mode='book';cur=back;W=null;
        banner='<div class="plate back"><h2>Back in the book</h2><p>The position matches a known trap line again. The hunt resumes.</p></div>';
        render(); banner=null;
        return;
      }
      render();
    }
  }
}

function applyMove(bd,from,to){
  let b=bd.split('');
  const p=b[from];
  if((p==='p'||p==='P') && (from%8)!==(to%8) && b[to]==='.'){
    b[Math.floor(from/8)*8+(to%8)]='.';           // en passant capture
  }
  if((p==='k'||p==='K') && Math.abs((from%8)-(to%8))===2){
    const row=Math.floor(from/8);
    if((to%8)===6){ b[row*8+5]=b[row*8+7]; b[row*8+7]='.'; }
    else { b[row*8+3]=b[row*8+0]; b[row*8+0]='.'; }
  }
  b[to]=p; b[from]='.';
  // promotion: default to queen
  if(p==='P' && Math.floor(to/8)===0) b[to]='Q';
  if(p==='p' && Math.floor(to/8)===7) b[to]='q';
  return b.join('');
}

// === nearest-book compass (rules only, no engine) ===
const RAYS_R=[[1,0],[-1,0],[0,1],[0,-1]],RAYS_B=[[1,1],[1,-1],[-1,1],[-1,-1]];
const KN=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]];
function isWpc(c){return c!=='.'&&c===c.toUpperCase();}
function attacked(bd,sq,byWhite){
  const r=Math.floor(sq/8),f=sq%8;
  const at=(rr,ff)=>rr<0||rr>7||ff<0||ff>7?'':bd[rr*8+ff];
  const en=c=>c!==''&&c!=='.'&&(isWpc(c)===byWhite);
  for(const[dr,df]of KN){const c=at(r+dr,f+df);if(en(c)&&c.toUpperCase()==='N')return true;}
  for(let dr=-1;dr<=1;dr++)for(let df=-1;df<=1;df++){if(!dr&&!df)continue;const c=at(r+dr,f+df);if(en(c)&&c.toUpperCase()==='K')return true;}
  const pdr=byWhite?1:-1;
  for(const df of[-1,1]){const c=at(r+pdr,f+df);if(en(c)&&c.toUpperCase()==='P')return true;}
  for(const[dr,df]of RAYS_R){let rr=r+dr,ff=f+df;for(;;){const c=at(rr,ff);if(c==='')break;if(c!=='.'){if(en(c)&&(c.toUpperCase()==='R'||c.toUpperCase()==='Q'))return true;break;}rr+=dr;ff+=df;}}
  for(const[dr,df]of RAYS_B){let rr=r+dr,ff=f+df;for(;;){const c=at(rr,ff);if(c==='')break;if(c!=='.'){if(en(c)&&(c.toUpperCase()==='B'||c.toUpperCase()==='Q'))return true;break;}rr+=dr;ff+=df;}}
  return false;
}
function genMoves(st){
  const bd=st.bd,white=st.turn==='w',out=[];
  const own=c=>c!=='.'&&(isWpc(c)===white),foe=c=>c!=='.'&&(isWpc(c)!==white);
  for(let i=0;i<64;i++){
    const p=bd[i];if(!own(p))continue;
    const r=Math.floor(i/8),f=i%8,u=p.toUpperCase();
    const push=(rr,ff)=>{if(rr<0||rr>7||ff<0||ff>7)return null;const j=rr*8+ff;if(own(bd[j]))return null;out.push({from:i,to:j});return bd[j]==='.';};
    if(u==='N'){for(const[dr,df]of KN)push(r+dr,f+df);}
    else if(u==='K'){
      for(let dr=-1;dr<=1;dr++)for(let df=-1;df<=1;df++)if(dr||df)push(r+dr,f+df);
      const home=white?7:0,Kc=white?'K':'k',Qc=white?'Q':'q';
      if(r===home&&f===4&&st.castle!=='-'){
        if(st.castle.includes(Kc)&&bd[home*8+5]==='.'&&bd[home*8+6]==='.'&&!attacked(bd,home*8+4,!white)&&!attacked(bd,home*8+5,!white)&&!attacked(bd,home*8+6,!white))out.push({from:i,to:home*8+6});
        if(st.castle.includes(Qc)&&bd[home*8+3]==='.'&&bd[home*8+2]==='.'&&bd[home*8+1]==='.'&&!attacked(bd,home*8+4,!white)&&!attacked(bd,home*8+3,!white)&&!attacked(bd,home*8+2,!white))out.push({from:i,to:home*8+2});
      }
    }
    else if(u==='R'||u==='B'||u==='Q'){
      const dirs=u==='Q'?[...RAYS_R,...RAYS_B]:(u==='R'?RAYS_R:RAYS_B);
      for(const[dr,df]of dirs){let rr=r+dr,ff=f+df;for(;;){const cont=push(rr,ff);if(cont!==true)break;rr+=dr;ff+=df;}}
    }
    else{
      const dir=white?-1:1,start=white?6:1;
      if(r+dir>=0&&r+dir<=7&&bd[(r+dir)*8+f]==='.'){
        out.push({from:i,to:(r+dir)*8+f});
        if(r===start&&bd[(r+2*dir)*8+f]==='.')out.push({from:i,to:(r+2*dir)*8+f});
      }
      for(const df of[-1,1]){const ff=f+df;if(ff<0||ff>7)continue;const j=(r+dir)*8+ff;
        if(j>=0&&j<64&&(foe(bd[j])||(st.ep!=='-'&&idxOf(st.ep)===j)))out.push({from:i,to:j});}
    }
  }
  return out;
}
function legalMovesSt(st){
  const white=st.turn==='w';
  return genMoves(st).filter(m=>{
    const bd=applyMove(st.bd,m.from,m.to);
    const k=bd.indexOf(white?'K':'k');
    return k>=0&&!attacked(bd,k,!white);
  });
}
function stepState(st,from,to){
  const p=st.bd[from];
  const bd=applyMove(st.bd,from,to);
  let c=st.castle==='-'?'':st.castle;
  const drop=ch=>{c=c.replace(ch,'');};
  if(p==='K'){drop('K');drop('Q');}
  if(p==='k'){drop('k');drop('q');}
  const touch=sq=>{if(sq===63)drop('K');if(sq===56)drop('Q');if(sq===7)drop('k');if(sq===0)drop('q');};
  touch(from);touch(to);
  let ep='-';
  if((p==='P'||p==='p')&&Math.abs(Math.floor(from/8)-Math.floor(to/8))===2){
    const midRow=(Math.floor(from/8)+Math.floor(to/8))/2,f2=to%8,enemy=p==='P'?'p':'P';
    if((f2>0&&bd[Math.floor(to/8)*8+f2-1]===enemy)||(f2<7&&bd[Math.floor(to/8)*8+f2+1]===enemy))ep='abcdefgh'[f2]+(8-midRow);
  }
  return {bd,turn:st.turn==='w'?'b':'w',castle:c||'-',ep};
}
function lookupState(st){
  const base=side+'|'+b64ToPlc(st.bd)+' '+st.turn+' '+st.castle+' ';
  if(st.ep!=='-'&&tree[base+st.ep])return base+st.ep;
  if(tree[base+'-'])return base+'-';
  return null;
}
function liveTraps(n){
  const s=new Set();
  Object.values(n.moves).forEach(e=>e.traps.forEach(t=>s.add(t)));
  if(!s.size&&n.end)s.add(n.end);
  return [...s];
}
function sanish(st,m){
  const p=st.bd[m.from],u=p.toUpperCase(),dest=sqName(m.to);
  const cap=st.bd[m.to]!=='.'||(u==='P'&&(m.from%8)!==(m.to%8));
  if(u==='K'&&Math.abs((m.from%8)-(m.to%8))===2)return (m.to%8)===6?'O-O':'O-O-O';
  if(u==='P')return cap?sqName(m.from)[0]+'x'+dest:dest;
  let dis='';
  for(const o of genMoves(st)){
    if(o.from!==m.from&&o.to===m.to&&st.bd[o.from].toUpperCase()===u){
      dis=(o.from%8)!==(m.from%8)?sqName(m.from)[0]:sqName(m.from)[1];break;
    }
  }
  return u+dis+(cap?'x':'')+dest;
}
function compass(){
  const res=new Map();
  for(const m of legalMovesSt(W)){
    const uci=sqName(m.from)+sqName(m.to);
    const s1=stepState(W,m.from,m.to);
    const k1=lookupState(s1);
    if(k1){
      const e=res.get(uci)||{san:sanish(W,m),dist:1,traps:new Set()};
      e.dist=1;liveTraps(tree[k1]).forEach(t=>e.traps.add(t));res.set(uci,e);
      continue;
    }
    for(const r of legalMovesSt(s1)){
      const k2=lookupState(stepState(s1,r.from,r.to));
      if(k2){
        const e=res.get(uci)||{san:sanish(W,m),dist:2,traps:new Set()};
        liveTraps(tree[k2]).forEach(t=>e.traps.add(t));res.set(uci,e);
      }
    }
  }
  return [...res.entries()].map(([uci,e])=>Object.assign({uci},e)).sort((a,b)=>a.dist-b.dist||b.traps.size-a.traps.size).slice(0,4);
}

function wanderMove(from,to){
  const p=W.bd[from];
  W.bd=applyMove(W.bd,from,to);
  // castling rights
  let c=W.castle==='-'?'':W.castle;
  const drop=ch=>{c=c.replace(ch,'');};
  if(p==='K'){drop('K');drop('Q');}
  if(p==='k'){drop('k');drop('q');}
  const touch=sq=>{
    if(sq===63)drop('K'); if(sq===56)drop('Q');   // h1,a1
    if(sq===7)drop('k');  if(sq===0)drop('q');    // h8,a8
  };
  touch(from);touch(to);
  W.castle=c||'-';
  // en passant target: pawn double push with adjacent enemy pawn
  W.ep='-';
  if((p==='P'||p==='p') && Math.abs(Math.floor(from/8)-Math.floor(to/8))===2){
    const midRow=(Math.floor(from/8)+Math.floor(to/8))/2, f=to%8;
    const enemy=p==='P'?'p':'P';
    if((f>0&&W.bd[Math.floor(to/8)*8+f-1]===enemy)||(f<7&&W.bd[Math.floor(to/8)*8+f+1]===enemy)){
      W.ep='abcdefgh'[f]+(8-midRow);
    }
  }
  W.turn=W.turn==='w'?'b':'w';
}

function lookup(){
  const plc=b64ToPlc(W.bd);
  const base=side+'|'+plc+' '+W.turn+' '+W.castle+' ';
  if(W.ep!=='-' && tree[base+W.ep]) return base+W.ep;
  if(tree[base+'-']) return base+'-';
  return null;
}

function advance(uci){
  pushHist();
  const n=tree[cur];
  const rj=n.moves[uci].rejoin;
  cur=n.moves[uci].to;sel=null;banner=null;
  render();
  if(rj){$('#stateline').textContent+=' · transposed back into book';}
}

function enterWander(uci){
  pushHist();
  const n=tree[cur];
  const kf=keyFields(cur);
  W={bd:nodeBoard(n),turn:kf.turn,castle:kf.castle,ep:kf.ep};
  const from=idxOf(uci.slice(0,2)),to=idxOf(uci.slice(2,4));
  wanderMove(from,to);
  mode='wander';
  const back=lookup();
  if(back){ mode='book';cur=back;W=null;
    banner='<div class="plate back"><h2>Transposed</h2><p>That move lands on a known book position — the hunt continues.</p></div>';
    render(); banner=null; return;
  }
  banner='<div class="plate deadend"><h2>Off the book</h2><p>Keep mirroring both sides. If the game returns to a known position, the book picks it up again.</p></div>';
  render();
}

// === setup mode: free rearrangement ===
function castleInfer(bd){
  let c='';
  if(bd[60]==='K'){ if(bd[63]==='R')c+='K'; if(bd[56]==='R')c+='Q'; }
  if(bd[4]==='k'){ if(bd[7]==='r')c+='k'; if(bd[0]==='r')c+='q'; }
  return c||'-';
}
function enterSetup(){
  const bd = mode==='wander' ? W.bd : nodeBoard(tree[cur]);
  const turn = mode==='wander' ? W.turn : keyFields(cur).turn;
  S={bd,turn,castle:castleInfer(bd),manual:false,pal:null,
     prev:{mode,cur,W:W?JSON.parse(JSON.stringify(W)):null}};
  mode='setup';over=false;sel=null;banner=null;
  render();
}
function setupDone(){
  const bd=S.bd;
  const wk=(bd.match(/K/g)||[]).length,bk=(bd.match(/k/g)||[]).length;
  if(wk!==1||bk!==1){ $('#stateline').textContent='need exactly one king per side'; return; }
  const mover=S.turn==='w';
  const restK=bd.indexOf(mover?'k':'K');
  if(attacked(bd,restK,mover)){ $('#stateline').textContent='side not to move is in check — fix the position'; return; }
  pushHist();
  W={bd:S.bd,turn:S.turn,castle:S.manual?S.castle:castleInfer(S.bd),ep:'-'};
  S=null;
  const back=lookupState(W);
  if(back){ mode='book';cur=back;W=null;
    banner='<div class="plate back"><h2>Back in the book</h2><p>The set-up position matches a known trap line. The hunt resumes.</p></div>';
  } else {
    mode='wander';
    banner='<div class="plate deadend"><h2>Position set</h2><p>Off the book — keep mirroring. The compass points the way back.</p></div>';
  }
  render();banner=null;
}
function setupTap(i){
  if(S.pal){ // place from palette
    const b=S.bd.split('');
    b[i]=S.pal;S.bd=b.join('');
    if(!S.manual)S.castle=castleInfer(S.bd);
    render();return;
  }
  if(sel===null){
    if(S.bd[i]==='.')return;
    sel=i;clearMarks();
    document.querySelector('.sq[data-i="'+i+'"]').classList.add('sel');
    return;
  }
  const b=S.bd.split('');
  if(sel===i){ b[i]='.'; }           // tap same square again = remove
  else { b[i]=b[sel]; b[sel]='.'; }  // free move, overwrite allowed
  S.bd=b.join('');sel=null;
  if(!S.manual)S.castle=castleInfer(S.bd);
  render();
}


function undo(){
  if(mode==='setup'){
    const p=S.prev;mode=p.mode;cur=p.cur;W=p.W;S=null;sel=null;banner=null;
    render();return;
  }
  if(!hist.length)return;
  const h=hist.pop();
  banner=null;over=false;sel=null;
  if(h.mode==='book'){mode='book';cur=h.cur;W=null;}
  else{mode='wander';W=h.W;}
  render();
}
function win(name){
  over=true;
  const info=DATA.traps[name]||{};
  const kind = info.verdict==='mate' ? 'Checkmate' : (info.qwin ? 'Queen won' : (info.safe ? 'Defused' : 'Advantage'));
  $('#stateline').textContent='trap sprung · '+kind.toLowerCase();$('#mainline').textContent='';
  $('#opts').innerHTML='<div class="plate win"><h2>'+kind+' — '+name+'</h2><p>'+(info.pun||'')+'</p><button onclick="reset()">new game</button></div>';
}
function reset(){over=false;sel=null;mode='book';W=null;banner=null;hist=[];cur=startId();render();}

document.querySelectorAll('.side').forEach(b=>b.addEventListener('click',()=>{
  side=b.dataset.side;tree=DATA.trees[side];$('#pick').style.display='none';reset();
}));
$('#reset').addEventListener('click',()=>{ $('#pick').style.display='flex'; });
$('#undo').addEventListener('click',undo);
$('#setup').addEventListener('click',()=>{ if(side)enterSetup(); });
$('#hunt').addEventListener('click',ev=>{
  const c=ev.target.closest('.cnt');
  if(c){huntOpen=!huntOpen;render();return;}
  const t=ev.target.closest('.tn');
  if(t&&t.dataset.trap&&DATA.traps[t.dataset.trap])trapCard(t.dataset.trap);
});
$('#mainline').addEventListener('click',ev=>{
  const tn=ev.target.closest('.tn');
  if(tn&&tn.dataset.trap&&DATA.traps[tn.dataset.trap]){trapCard(tn.dataset.trap);return;}
  const t=ev.target.closest('.mv');
  if(!t||!t.dataset.uci||over)return;
  if(mode==='book'){advance(t.dataset.uci);return;}
  if(mode==='wander'){
    const uci=t.dataset.uci;
    const from=idxOf(uci.slice(0,2)),to=idxOf(uci.slice(2,4));
    pushHist();banner=null;sel=null;
    wanderMove(from,to);
    const back=lookup();
    if(back){
      mode='book';cur=back;W=null;
      banner='<div class="plate back"><h2>Back in the book</h2><p>The position matches a known trap line again. The hunt resumes.</p></div>';
      render();banner=null;return;
    }
    render();
  }
});
</script>
</body>
</html>
